<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Zen Essentials Split Tabs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <style>
      .t   { font-family:'Segoe UI',Ubuntu,system-ui,sans-serif; fill:#ffffff; }
      .sub { font-family:'Segoe UI',Ubuntu,system-ui,sans-serif; fill:#DBEAFE; }
      .lbl { font-family:'Segoe UI',Ubuntu,system-ui,sans-serif; fill:#E0F2FE; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="340" rx="28" fill="url(#bg)"/>

  <!-- sidebar with two marked essentials -->
  <g transform="translate(70,74)">
    <text class="lbl" x="56" y="-14" font-size="15" text-anchor="middle" opacity="0.85">Essentials</text>

    <rect x="0" y="0" width="112" height="196" rx="16" fill="#ffffff" fill-opacity="0.10"/>

    <!-- grouped pair: marked with the indicator bar -->
    <g>
      <rect x="14" y="14" width="38" height="38" rx="10" fill="#ffffff" fill-opacity="0.22"/>
      <circle cx="33" cy="30" r="8" fill="#93C5FD"/>
      <rect x="26" y="44" width="14" height="4" rx="2" fill="#38BDF8"/>

      <rect x="60" y="14" width="38" height="38" rx="10" fill="#ffffff" fill-opacity="0.22"/>
      <circle cx="79" cy="30" r="8" fill="#93C5FD"/>
      <rect x="72" y="44" width="14" height="4" rx="2" fill="#38BDF8"/>
    </g>

    <!-- plain essentials -->
    <g fill="#ffffff" fill-opacity="0.14">
      <rect x="14" y="62"  width="38" height="38" rx="10"/>
      <rect x="60" y="62"  width="38" height="38" rx="10"/>
      <rect x="14" y="110" width="38" height="38" rx="10"/>
      <rect x="60" y="110" width="38" height="38" rx="10"/>
    </g>
    <g fill="#C7D2FE" fill-opacity="0.65">
      <circle cx="33" cy="81"  r="7"/>
      <circle cx="79" cy="81"  r="7"/>
      <circle cx="33" cy="129" r="7"/>
      <circle cx="79" cy="129" r="7"/>
    </g>
  </g>

  <!-- arrow -->
  <g transform="translate(206,172)">
    <path d="M0 0 H62" stroke="#A5B4FC" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M62 0 l-18 -10 v20 z" fill="#A5B4FC"/>
  </g>

  <!-- split content area: two panes -->
  <g transform="translate(292,74)">
    <text class="lbl" x="98" y="-14" font-size="15" text-anchor="middle" opacity="0.95">One click</text>

    <rect x="0"   y="0" width="94" height="196" rx="14" fill="#ffffff" fill-opacity="0.20"/>
    <rect x="102" y="0" width="94" height="196" rx="14" fill="#ffffff" fill-opacity="0.20"/>

    <g fill="#BFDBFE" fill-opacity="0.9">
      <rect x="16"  y="20" width="62" height="7" rx="3.5"/>
      <rect x="16"  y="36" width="44" height="7" rx="3.5"/>
      <rect x="118" y="20" width="62" height="7" rx="3.5"/>
      <rect x="118" y="36" width="44" height="7" rx="3.5"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.16">
      <rect x="16"  y="58" width="62" height="118" rx="8"/>
      <rect x="118" y="58" width="62" height="118" rx="8"/>
    </g>

    <circle cx="47"  cy="117" r="13" fill="#60A5FA"/>
    <circle cx="149" cy="117" r="13" fill="#A78BFA"/>
  </g>

  <!-- title block -->
  <text class="t"   x="560" y="150" font-size="46" font-weight="700">Zen Essentials Split Tabs</text>
  <text class="sub" x="562" y="192" font-size="21">Group 2, 3 or 4 Essentials so they open together</text>
  <text class="sub" x="562" y="220" font-size="21">in Zen&#39;s split view.</text>
  <g transform="translate(562,244)" font-size="14">
    <rect width="118" height="30" rx="15" fill="#ffffff" fill-opacity="0.16"/>
    <text class="lbl" x="59" y="20" text-anchor="middle">Zen Browser</text>
    <rect x="130" width="70" height="30" rx="15" fill="#ffffff" fill-opacity="0.16"/>
    <text class="lbl" x="165" y="20" text-anchor="middle">Sine</text>
    <rect x="210" width="126" height="30" rx="15" fill="#ffffff" fill-opacity="0.16"/>
    <text class="lbl" x="273" y="20" text-anchor="middle">JS + CSS</text>
  </g>
</svg>
